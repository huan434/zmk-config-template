# Bật ZMK Studio để chỉnh layout trực quan
CONFIG_ZMK_STUDIO=y

# Bật hỗ trợ Encoder (núm xoay) cho Pipar Flake
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Tiết kiệm pin
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_DEEP_SLEEP_MS=900000
# Bật tính năng tối ưu hóa lưu trữ cấu hình trên flash
CONFIG_SETTINGS=y

# Tăng kích thước vùng chứa storage nếu cần lưu nhiều dữ liệu cá nhân hóa (mặc định thường đã tự động tối ưu theo board)
